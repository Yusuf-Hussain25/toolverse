<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Toolverse brings AI writing, image generation, background and object removal and resume reviews into one workspace." />
    <meta name="theme-color" content="#f7f7fa" />
    <title>Toolverse · Your AI toolkit for words and images</title>
    <script>
      // Light by default; apply a saved dark (or system) choice before first paint to avoid a flash
      try {
        var saved = localStorage.getItem('toolverse-theme');
        var dark = saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
